<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spectrum_qr</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brass: #b8860b;
            --brass-light: #d4af37;
            --steel-dark: #0e0e0e;
            --steel-mid: #1a1a1a;
            --steel-light: #2b2b2b;
            --r-channel: #ff3333;
            --g-channel: #33ff33;
            --b-channel: #3399ff;
            --accent-create: #d97706; /* Orange */
            --accent-scan: #22c55e; /* Green */
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--steel-dark);
            color: #e0e0e0;
            touch-action: manipulation;
            overflow: hidden; /* App-like feel */
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Industrial Texture Overlay */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.1'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Typography */
        .font-stencil { font-family: 'Black Ops One', cursive; }
        .font-data { font-family: 'Share Tech Mono', monospace; }

        /* UI Components */
        .metal-bg {
            background: linear-gradient(180deg, rgba(30,30,30,0.9) 0%, rgba(15,15,15,0.95) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-main {
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn-main:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.9);
        }

        /* View Transitions */
        .view {
            flex: 1;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .view.active {
            display: flex;
            opacity: 1;
        }

        /* Inputs */
        .input-industrial {
            background: rgba(0,0,0,0.4);
            border: 2px solid #444;
            color: #fff;
            transition: all 0.3s;
            resize: none;
        }
        .input-industrial:focus {
            outline: none;
            border-color: var(--brass);
            background: rgba(0,0,0,0.6);
        }

        /* Scanner HUD */
        .scanner-overlay {
            position: absolute;
            inset: 0;
            border: 4px solid transparent;
            pointer-events: none;
            transition: border-color 0.2s;
            z-index: 20;
        }
        .scanner-overlay.active {
            border-color: var(--g-channel);
            box-shadow: 0 0 20px var(--g-channel);
        }
        
        /* Synced Textareas Height Fix */
        .sync-textarea {
            min-height: 80px;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="app-shell">
    
    <!-- HEADER -->
    <header class="metal-bg sticky top-0 z-50 flex items-center justify-between p-3 h-14">
        <button id="btn-back" onclick="navBack()" class="w-10 h-10 flex items-center justify-center text-2xl text-zinc-400 hover:text-white transition hidden">
            ←
        </button>
        <h1 id="page-title" class="font-stencil text-xl text-zinc-100 tracking-wide absolute left-1/2 transform -translate-x-1/2">
            SPECTRUM_QR
        </h1>
        <button id="btn-menu" onclick="toggleMenu()" class="w-10 h-10 flex items-center justify-center text-2xl text-zinc-400 hover:text-white transition">
            ☰
        </button>
    </header>

    <!-- BURGER MENU -->
    <div id="menu-panel" class="fixed inset-0 bg-black/90 z-[60] hidden flex-col items-center justify-center gap-6 text-center">
        <button onclick="navTo('history'); toggleMenu()" class="text-2xl font-stencil text-zinc-300 hover:text-brass-light">HISTORY</button>
        <button onclick="navTo('manual'); toggleMenu()" class="text-2xl font-stencil text-zinc-300 hover:text-brass-light">MANUAL</button>
        <button onclick="navTo('gallery'); toggleMenu()" class="text-2xl font-stencil text-zinc-300 hover:text-brass-light">GALLERY</button>
        <button onclick="toggleMenu()" class="text-2xl font-stencil text-zinc-500 mt-10">✕ CLOSE</button>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 overflow-hidden relative">

        <!-- VIEW: LANDING -->
        <div id="view-landing" class="view active p-6 flex flex-col items-center justify-center gap-8">
            <button onclick="navTo('selection')" class="btn-main w-full max-w-xs py-8 rounded-xl bg-gradient-to-br from-orange-600 to-orange-800 font-stencil text-2xl flex items-center justify-center gap-3">
                <span class="text-3xl">+</span> CREATE
            </button>
            <button onclick="startScanner()" class="btn-main w-full max-w-xs py-8 rounded-xl bg-gradient-to-br from-green-600 to-green-900 font-stencil text-2xl flex items-center justify-center gap-3">
                <span class="text-3xl">🔍</span> SCAN
            </button>
        </div>

        <!-- VIEW: SELECTION -->
        <div id="view-selection" class="view p-6 flex flex-col items-center justify-center gap-6">
            <h2 class="font-stencil text-lg text-zinc-400 mb-4">SELECT MODE</h2>
            <button onclick="navTo('ornament')" class="btn-main w-full max-w-xs py-6 rounded-xl border-2 border-zinc-600 bg-zinc-900 hover:bg-zinc-800 font-stencil text-xl text-zinc-200">
                QRNAMENT
            </button>
            <button onclick="navTo('spectrum')" class="btn-main w-full max-w-xs py-6 rounded-xl border-2 border-zinc-600 bg-zinc-900 hover:bg-zinc-800 font-stencil text-xl text-zinc-200">
                3D-QR (SPECTRUM)
            </button>
        </div>

        <!-- VIEW: ORNAMENT GENERATOR -->
        <div id="view-ornament" class="view overflow-y-auto">
            <div class="flex flex-col h-full">
                <!-- Preview Area (Sticky) -->
                <div class="sticky top-0 bg-steel-dark/95 backdrop-blur p-4 flex flex-col items-center border-b border-zinc-800 z-10" onclick="blurInputs()">
                    <div class="w-48 h-48 bg-black p-2 rounded border-4 border-zinc-700 shadow-lg">
                        <canvas id="canvas-ornament" width="180" height="180" class="w-full h-full"></canvas>
                    </div>
                    <!-- Status Indicators -->
                    <div id="ornament-stats" class="text-[10px] text-zinc-500 mt-2 font-mono hidden">
                        MATRIX: <span id="stat-size">21x21</span> | MODE: ARTISTIC
                    </div>
                </div>

                <!-- Controls -->
                <div class="flex-1 p-4 flex flex-col gap-4">
                    <textarea id="input-ornament" 
                        class="input-industrial w-full p-3 rounded font-data text-sm border-blue-500 h-24" 
                        placeholder="Enter text for Ornament QR..."
                        oninput="generateOrnament()"></textarea>
                    
                    <div class="flex gap-3">
                        <button onclick="randomizeOrnament()" id="btn-ornament-random" class="btn-main flex-1 py-3 rounded bg-zinc-800 text-zinc-300 hidden font-stencil text-sm">
                            REGNERATE
                        </button>
                        <button onclick="saveImage('ornament')" id="btn-ornament-save" class="btn-main flex-1 py-3 rounded bg-blue-900 text-blue-100 hidden font-stencil text-sm">
                            SAVE
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW: SPECTRUM GENERATOR (TriadQR) -->
        <div id="view-spectrum" class="view overflow-y-auto">
            <div class="flex flex-col h-full">
                <!-- Preview Area -->
                <div class="sticky top-0 bg-steel-dark/95 backdrop-blur p-4 flex flex-col items-center border-b border-zinc-800 z-10" onclick="blurInputs()">
                    <div class="w-56 h-56 bg-black p-1 rounded border-4 border-zinc-700 shadow-lg relative">
                        <canvas id="canvas-spectrum" width="512" height="512" class="w-full h-full"></canvas>
                    </div>
                    <!-- Technical Stats -->
                    <div class="text-[10px] text-zinc-500 mt-2 font-mono">
                        MATRIX: <span id="stat-matrix">-</span> | TRIAD-RGB
                    </div>
                </div>

                <!-- Inputs -->
                <div class="flex-1 p-4 flex flex-col gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-red-400 font-bold tracking-wider">RED CHANNEL</label>
                        <textarea id="input-r" class="input-industrial w-full p-2 rounded font-data text-sm border-red-500 sync-textarea" oninput="syncHeights(); generateSpectrum()" placeholder="Data..."></textarea>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-green-400 font-bold tracking-wider">GREEN CHANNEL</label>
                        <textarea id="input-g" class="input-industrial w-full p-2 rounded font-data text-sm border-green-500 sync-textarea" oninput="syncHeights(); generateSpectrum()" placeholder="Data..."></textarea>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-blue-400 font-bold tracking-wider">BLUE CHANNEL</label>
                        <textarea id="input-b" class="input-industrial w-full p-2 rounded font-data text-sm border-blue-500 sync-textarea" oninput="syncHeights(); generateSpectrum()" placeholder="Data..."></textarea>
                    </div>
                    
                    <button onclick="saveImage('spectrum')" id="btn-spectrum-save" class="btn-main w-full py-3 rounded bg-blue-900 text-blue-100 hidden font-stencil mt-2">
                        SAVE RESULT
                    </button>
                </div>
            </div>
        </div>

        <!-- VIEW: SCANNER -->
        <div id="view-scanner" class="view bg-black">
            <div class="relative w-full h-full flex flex-col items-center justify-center">
                <video id="scanner-video" class="absolute inset-0 w-full h-full object-cover z-10" playsinline></video>
                <canvas id="scanner-canvas" class="absolute inset-0 w-full h-full object-cover z-12 hidden"></canvas>
                
                <!-- HUD Overlay -->
                <div class="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
                    <div id="scanner-hud" class="w-64 h-64 border-4 border-zinc-600 rounded-xl relative">
                        <div class="corner tl"></div><div class="corner tr"></div>
                        <div class="corner bl"></div><div class="corner br"></div>
                        <div class="absolute -top-8 left-0 right-0 text-center text-xs text-zinc-400" id="scanner-status">ALIGN QR</div>
                    </div>
                </div>

                <!-- Results Overlay -->
                <div id="scan-results" class="absolute bottom-0 left-0 right-0 p-4 bg-black/80 backdrop-blur z-30 hidden">
                    <div class="text-xs font-mono mb-2 text-zinc-400">DECODED DATA:</div>
                    <div class="text-sm text-green-400 break-all" id="scan-output"></div>
                </div>
            </div>
        </div>

    </main>
</div>

<script>
    // === STATE MANAGEMENT ===
    const historyStack = [];
    const current = { view: 'landing', data: {} };
    
    // Elements Cache
    const DOM = {
        title: document.getElementById('page-title'),
        backBtn: document.getElementById('btn-back'),
        menuBtn: document.getElementById('btn-menu'),
        menuPanel: document.getElementById('menu-panel'),
        viewContainer: document.getElementById('view-container'),
        // Canvases
        cOrnament: document.getElementById('canvas-ornament'),
        cSpectrum: document.getElementById('canvas-spectrum'),
        cScanner: document.getElementById('scanner-canvas'),
        video: document.getElementById('scanner-video'),
        // Inputs
        iOrnament: document.getElementById('input-ornament'),
        iR: document.getElementById('input-r'),
        iG: document.getElementById('input-g'),
        iB: document.getElementById('input-b'),
        // Buttons
        saveOrnament: document.getElementById('btn-ornament-save'),
        randomOrnament: document.getElementById('btn-ornament-random'),
        saveSpectrum: document.getElementById('btn-spectrum-save'),
        // Stats
        statMatrix: document.getElementById('stat-matrix'),
        statSize: document.getElementById('stat-size'),
        ornamentStats: document.getElementById('ornament-stats')
    };

    // === NAVIGATION ENGINE ===
    function navTo(viewId) {
        // Push current state to history
        historyStack.push(current.view);
        
        // Update State
        updateView(viewId);
    }

    function navBack() {
        if (historyStack.length > 0) {
            const prevView = historyStack.pop();
            updateView(prevView);
        } else {
            updateView('landing');
        }
    }

    function updateView(viewId) {
        // UI Updates
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const target = document.getElementById(`view-${viewId}`);
        if(target) target.classList.add('active');

        // Header Logic
        const isLanding = viewId === 'landing';
        DOM.backBtn.classList.toggle('hidden', isLanding);
        DOM.menuBtn.classList.toggle('hidden', viewId === 'scanner'); // Hide menu in scanner

        // Title Logic
        const titles = {
            landing: 'SPECTRUM_QR',
            selection: 'CREATE',
            ornament: 'QRNAMENT',
            spectrum: '3D-QR',
            scanner: 'SCANNER'
        };
        DOM.title.textContent = titles[viewId] || 'SPECTRUM_QR';

        // Stop scanner if leaving scanner view
        if (viewId !== 'scanner') stopScanner();

        current.view = viewId;
    }

    function toggleMenu() {
        DOM.menuPanel.classList.toggle('hidden');
        DOM.menuPanel.classList.toggle('flex');
    }

    // === ENGINES ===

    // --- 1. Ornament QR (Standard) ---
    function generateOrnament() {
        const text = DOM.iOrnament.value;
        if (!text) {
            DOM.saveOrnament.classList.add('hidden');
            DOM.randomOrnament.classList.add('hidden');
            DOM.ornamentStats.classList.add('hidden');
            return clearCanvas(DOM.cOrnament);
        }

        // Show buttons
        DOM.saveOrnament.classList.remove('hidden');
        DOM.randomOrnament.classList.remove('hidden');
        DOM.ornamentStats.classList.remove('hidden');

        // Generate
        try {
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            
            const size = qr.getModuleCount();
            DOM.statSize.textContent = `${size}x${size}`;
            
            const ctx = DOM.cOrnament.getContext('2d');
            const cw = DOM.cOrnament.width;
            const cellSize = cw / size;

            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, cw, cw);

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (qr.isDark(r, c)) {
                        ctx.fillStyle = "#000000";
                        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    }
                }
            }
        } catch(e) { console.error(e); }
    }

    function randomizeOrnament() {
        // Placeholder: Simply re-focusing triggers UI interaction
        // In a real app, this might change pattern sets.
        generateOrnament();
    }

    // --- 2. Spectrum QR (Triad Engine) ---
    function generateSpectrum() {
        const rText = DOM.iR.value;
        const gText = DOM.iG.value;
        const bText = DOM.iB.value;
        
        const ctx = DOM.cSpectrum.getContext('2d');
        const w = 512, h = 512;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, w, h);

        // Logic: Show Save ONLY if all 3 filled
        if (rText && gText && bText) {
            DOM.saveSpectrum.classList.remove('hidden');
        } else {
            DOM.saveSpectrum.classList.add('hidden');
        }

        if (!rText && !gText && !bText) {
            DOM.statMatrix.textContent = "-";
            return;
        }

        // Find Max Version needed
        let maxVer = 1;
        [rText, gText, bText].forEach(t => {
            if(!t) return;
            const tmp = qrcode(0, 'M');
            try {
                tmp.addData(unescape(encodeURIComponent(t)));
                tmp.make();
                const v = Math.floor((tmp.getModuleCount() - 17) / 4);
                if (v > maxVer) maxVer = v;
            } catch(e) {}
        });

        DOM.statMatrix.textContent = `${(maxVer*4)+17}x${(maxVer*4)+17}`;

        // Draw Layers
        ctx.globalCompositeOperation = "lighten");
        
        const colors = ["#FF0000", "#00FF00", "#0000FF"];
        const texts = [rText, gText, bText];

        texts.forEach((text, i) => {
            if(!text) return;
            try {
                const qr = qrcode(maxVer, 'M');
                qr.addData(unescape(encodeURIComponent(text)));
                qr.make();
                
                const mod = w / qr.getModuleCount();
                ctx.fillStyle = colors[i];
                
                for (let r = 0; r < qr.getModuleCount(); r++) {
                    for (let c = 0; c < qr.getModuleCount(); c++) {
                        if (qr.isDark(r, c)) {
                            ctx.fillRect(c * mod, r * mod, mod, mod);
                        }
                    }
                }
            } catch(e) { console.error("QR Gen Error", e); }
        });
        
        ctx.globalCompositeOperation = "source-over";
    }

    // --- 3. Scanner Engine ---
    let scanning = false;
    let scannerState = { locked: {r:false, g:false, b:false}, time: 0, config: { R:{k1:0.1,k2:0.2}, G:{k1:0.18,k2:0.33}, B:{k1:0.05,k2:0.13} } };

    async function startScanner() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            DOM.video.srcObject = stream;
            DOM.video.play();
            navTo('scanner');
            scanning = true;
            requestAnimationFrame(scannerLoop);
        } catch(e) { alert("Camera Access Denied"); }
    }

    function stopScanner() {
        scanning = false;
        if(DOM.video.srcObject) DOM.video.srcObject.getTracks().forEach(t => t.stop());
        DOM.video.srcObject = null;
    }

    function scannerLoop() {
        if (!scanning) return;
        if (DOM.video.readyState === DOM.video.HAVE_ENOUGH_DATA) {
            // Draw video to canvas for processing
            const cv = DOM.cScanner;
            const ctx = cv.getContext('2d', { willReadFrequently: true });
            
            // Resize canvas to match video stream resolution logic for processing
            // Simplified: draw to fixed 512x512 for engine compatibility
            const vw = DOM.video.videoWidth, vh = DOM.video.videoHeight;
            const size = Math.min(vw, vh);
            
            cv.width = 512; cv.height = 512;
            ctx.drawImage(DOM.video, (vw-size)/2, (vh-size)/2, size, size, 0, 0, 512, 512);

            // Run Triad Logic (Simplified Oscillator)
            scannerState.time++;
            
            // Oscillator params
            const gain = 1.0 + Math.sin(scannerState.time / 30) * 0.5;
            const offset = Math.sin(scannerState.time / 60) * 30;

            // Try decode channels round-robin
            const activeChannels = ['R', 'G', 'B'].filter(c => !scannerState.locked[c.toLowerCase()]);
            
            if (activeChannels.length > 0) {
                // Pick one channel to process this frame
                const ch = activeChannels[0]; 
                const cfg = scannerState.config[ch];
                
                // Process Image Data (Placeholder for SCI logic)
                let imgData = ctx.getImageData(0, 0, 512, 512);
                // Apply simple brightness/contrast modification based on oscillator
                // ... (Full SCI logic can be inserted here)
                
                // Try Decode
                const code = jsQR(imgData.data, 512, 512, { inversionAttempts: "attemptBoth" });
                if (code) {
                    lockChannel(ch, code.data);
                }
            }
        }
        requestAnimationFrame(scannerLoop);
    }

    function lockChannel(ch, data) {
        if(scannerState.locked[ch.toLowerCase()]) return;
        
        scannerState.locked[ch.toLowerCase()] = true;
        
        // Visual Feedback
        const hud = document.getElementById('scanner-hud');
        hud.style.borderColor = ch === 'R' ? 'var(--r-channel)' : (ch === 'G' ? 'var(--g-channel)' : 'var(--b-channel)');
        
        // Fill inputs in background
        document.getElementById(`input-${ch.toLowerCase()}`).value = data;
        
        // Vibrate
        if(navigator.vibrate) navigator.vibrate(100);

        // Check if all done
        if (scannerState.locked.r && scannerState.locked.g && scannerState.locked.b) {
            scanning = false; // Stop loop
            setTimeout(() => {
                stopScanner();
                navTo('spectrum'); // Show result
                generateSpectrum();
            }, 500);
        }
    }

    // === UTILITIES ===
    function syncHeights() {
        // Synchronous height adjustment for Spectrum inputs
        const tas = document.querySelectorAll('.sync-textarea');
        let maxH = 0;
        tas.forEach(t => { t.style.height = 'auto'; maxH = Math.max(maxH, t.scrollHeight); });
        tas.forEach(t => { t.style.height = maxH + 'px'; });
    }

    function blurInputs() {
        document.activeElement.blur();
    }

    function clearCanvas(canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function saveImage(type) {
        const canvas = type === 'spectrum' ? DOM.cSpectrum : DOM.cOrnament;
        const link = document.createElement('a');
        link.download = `SpectrumQR_${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }

</script>
</body>
</html>
