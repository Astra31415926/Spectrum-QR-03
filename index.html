<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL: Prevent zoom on input focus (iOS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spectrum_qr</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <!-- Fonts: Orbitron (Tech) & Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* === 1. GLOBAL RESET & VARIABLES === */
        :root {
            --bg-app: #121212;
            --bg-surface: #1E1E1E;
            --text-primary: #FFFFFF;
            --text-secondary: #888888;
            --accent-orange: #FF6200;
            --accent-green: #00FF9D;
            --accent-brass: #B8860B; /* Old Brass */
            --accent-steel: #2F4F4F; /* Gunmetal */
            
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            margin: 0; padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Disable scroll bounce */
            background-color: var(--bg-app);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        /* === 2. APP SHELL (SPA CONTAINER) === */
        #app {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-top: var(--safe-area-top);
            padding-bottom: var(--safe-area-bottom);
        }

        /* === 3. HEADER COMPONENT === */
        .app-header {
            height: 56px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            z-index: 100;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }

        .header-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
        }
        .header-btn:active { opacity: 0.7; }

        /* === 4. SCREENS MANAGEMENT === */
        .screen {
            flex: 1;
            display: none; /* Hidden by default */
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        .screen.active { display: flex; }

        /* === 5. BUTTONS (Massive & Touch Friendly) === */
        .btn-massive {
            width: 100%;
            min-height: 72px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 2px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            text-transform: uppercase;
        }
        .btn-massive:active { transform: scale(0.98); }
        
        .btn-create { background: var(--accent-orange); color: white; box-shadow: 0 4px 20px rgba(255, 98, 0, 0.3); }
        .btn-scan { background: var(--accent-green); color: #000; box-shadow: 0 4px 20px rgba(0, 255, 157, 0.3); }
        
        /* Secondary Buttons (In Generator) */
        .btn-control {
            flex: 1;
            height: 48px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            background: var(--bg-surface);
            border: 1px solid #333;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-control:active { background: #333; }
        .btn-control:disabled { opacity: 0.3; pointer-events: none; }
        
        /* === 6. GENERATOR LAYOUT (The "Anti-Alice" Model) === */
        .gen-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* Zone 1: Sacred QR Area (Fixed at Top) */
        .zone-sacred {
            height: 40vh; /* Strict height requirement */
            min-height: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #000;
            border-bottom: 1px solid #222;
            cursor: pointer; /* Indicates tapability to close keyboard */
        }

        .qr-frame {
            width: auto;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1;
            background: #111;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Zone 2: Controls */
        .zone-controls {
            flex-shrink: 0;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            background: var(--bg-app);
            border-bottom: 1px solid #222;
        }

        /* Zone 3: Input Area (Fills rest) */
        .zone-input {
            flex: 1;
            padding: 16px;
            overflow-y: auto; /* Scrollable content if needed */
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* === 7. INPUTS & SYNC LOGIC === */
        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .input-label {
            font-size: 10px;
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .sync-input {
            width: 100%;
            resize: none;
            background: var(--bg-surface);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 16px; /* CRITICAL: Prevents iOS zoom */
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
            outline: none;
            transition: border-color 0.2s, height 0.1s;
        }
        .sync-input:focus { border-color: var(--accent-orange); }

        /* Specific Channel Colors */
        .ch-r { border-left: 3px solid var(--accent-orange); }
        .ch-g { border-left: 3px solid var(--accent-green); }
        .ch-b { border-left: 3px solid var(--accent-steel); }

        /* === 8. CAMERA OVERLAY === */
        #camera-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 500;
            background: #000;
            display: none;
            flex-direction: column;
        }
        #video-feed {
            flex: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .camera-hud {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            aspect-ratio: 1;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.6);
        }

        /* === 9. ANIMATIONS === */
        @keyframes flash-active {
            0% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.02); box-shadow: 0 0 15px var(--accent-green); }
            100% { opacity: 1; transform: scale(1); }
        }
        .flash-animation { animation: flash-active 0.3s ease-out; }

    </style>
</head>
<body>

<div id="app">
    
    <!-- HEADER (Persistent) -->
    <header class="app-header">
        <div id="header-left" class="w-12">
            <!-- Back Arrow injected here by JS -->
        </div>
        <div id="header-title" class="header-title">Spectrum_qr</div>
        <div id="header-right" class="w-12 flex justify-end">
            <div class="header-btn" onclick="toggleMenu()">☰</div>
        </div>
    </header>

    <!-- SCREEN A: LANDING -->
    <div id="screen-landing" class="screen active">
        <div class="flex-1 flex flex-col items-center justify-center p-8 gap-6">
            <button class="btn-massive btn-create" onclick="navTo('selection')">
                CREATE
            </button>
            <button class="btn-massive btn-scan" onclick="openCamera()">
                SCAN <span>🔍</span>
            </button>
        </div>
    </div>

    <!-- SCREEN B: SELECTION -->
    <div id="screen-selection" class="screen">
        <div class="flex-1 flex flex-col items-center justify-center p-8 gap-6">
            <button class="btn-massive btn-create" style="background: #444; box-shadow: none;" onclick="navTo('generator', 'ornament')">
                ORNAMENT QR
            </button>
            <button class="btn-massive btn-create" style="background: #222; border: 2px solid var(--accent-orange);" onclick="navTo('generator', 'spectrum')">
                3D SPECTRUM QR
            </button>
        </div>
    </div>

    <!-- SCREEN C: GENERATOR -->
    <div id="screen-generator" class="screen">
        <div class="gen-layout">
            
            <!-- Sacred Zone (Top) -->
            <div class="zone-sacred" onclick="hideKeyboard()">
                <div class="qr-frame">
                    <canvas id="canvas-output" width="512" height="512" style="width: 100%; height: 100%; object-fit: contain;"></canvas>
                </div>
                <div id="tech-stats" class="text-[10px] text-zinc-600 mt-2 tracking-widest">
                    STANDBY | MATRIX: NULL
                </div>
            </div>

            <!-- Control Zone (Middle) -->
            <div class="zone-controls">
                <button id="btn-save" class="btn-control" onclick="saveImage()" disabled>SAVE</button>
                <button id="btn-scan-mode" class="btn-control" onclick="openCamera()">SCAN</button>
                <button id="btn-regen" class="btn-control hidden" onclick="regenerateOrnament()">REGENERATE</button>
            </div>

            <!-- Input Zone (Bottom) -->
            <div class="zone-input">
                
                <!-- Ornament Mode Inputs -->
                <div id="input-ornament" class="hidden flex-1">
                    <textarea id="text-single" class="sync-input h-full w-full" placeholder="Enter data..." oninput="handleInput()"></textarea>
                </div>

                <!-- Spectrum Mode Inputs -->
                <div id="input-spectrum" class="hidden flex-1 flex flex-col gap-3">
                    <div class="input-wrapper flex-1">
                        <span class="input-label text-red-400">RED CHANNEL</span>
                        <textarea id="text-r" class="sync-input ch-r h-full" placeholder="Channel R..." oninput="handleInput()"></textarea>
                    </div>
                    <div class="input-wrapper flex-1">
                        <span class="input-label text-green-400">GREEN CHANNEL</span>
                        <textarea id="text-g" class="sync-input ch-g h-full" placeholder="Channel G..." oninput="handleInput()"></textarea>
                    </div>
                    <div class="input-wrapper flex-1">
                        <span class="input-label text-blue-400">BLUE CHANNEL</span>
                        <textarea id="text-b" class="sync-input ch-b h-full" placeholder="Channel B..." oninput="handleInput()"></textarea>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- CAMERA OVERLAY -->
    <div id="camera-overlay">
        <video id="video-feed" autoplay playsinline></video>
        <div class="camera-hud"></div>
        <button class="absolute top-4 left-4 text-white text-3xl z-10" onclick="closeCamera()">✕</button>
        <canvas id="canvas-scan" class="hidden"></canvas>
    </div>

    <!-- MENU OVERLAY -->
    <div id="menu-overlay" class="fixed inset-0 bg-black/95 z-[200] hidden flex-col items-center justify-center gap-8">
        <a href="#" class="text-2xl font-bold text-zinc-300">History</a>
        <a href="#" class="text-2xl font-bold text-zinc-300">Manual</a>
        <a href="#" class="text-2xl font-bold text-zinc-300">Contacts</a>
        <button onclick="toggleMenu()" class="mt-8 text-zinc-500">Close</button>
    </div>

</div>

<script>
    // === 1. STATE MANAGEMENT ===
    const state = {
        currentScreen: 'landing',
        mode: null, // 'ornament' | 'spectrum'
        seed: Math.random() 
    };

    // === 2. SPRITE LIBRARY (Mandala) ===
    const SPRITE_LIB = [
        [73,42,28,127,28,42,73], [127,65,93,85,93,65,127], [85,62,99,42,99,62,85],
        [42,119,34,73,34,119,42], [28,42,73,119,73,42,28], [0,62,34,42,46,32,63],
        [15,1,29,5,52,16,64], [64,96,112,120,112,96,64], [76,102,51,25,51,102,76],
        [119,69,117,0,87,81,119], [119,85,119,0,119,85,119], [119,65,93,20,93,65,119],
        [62,73,93,127,93,73,62], [42,107,8,119,8,107,42], [8,42,8,119,8,42,8],
        [28,8,65,99,65,8,28], [54,99,73,20,73,99,54], [63,31,15,7,3,1,0],
        [127,63,31,15,7,3,1], [127,31,31,7,7,1,1], [119,17,93,68,119,17,89],
        [119,21,87,80,127,17,89], [119,85,127,20,127,85,119], [87,80,87,0,117,5,117],
        [95,80,87,65,117,5,125], [30,80,87,65,117,5,60], [91,80,11,93,104,5,109],
        [42,99,8,93,8,99,42], [99,99,0,0,0,99,99], [99,99,99,99,99,99,99],
        [119,93,99,34,99,93,119], [54,85,99,8,99,85,54], [91,73,109,36,54,18,91],
        [127,8,107,34,107,8,127], [42,34,42,8,42,34,42], [56,43,9,127,72,106,14],
        [60,72,81,99,69,9,30], [12,56,33,107,66,14,24], [32,126,34,34,34,63,2],
        [100,94,51,42,102,61,19], [6,92,118,34,55,29,48], [28,62,119,99,119,62,28],
        [62,99,73,93,73,99,62], [126,67,89,85,77,97,63], [54,85,107,28,107,85,54],
        [127,119,99,73,99,119,127], [12,22,51,113,14,76,104], [107,73,8,127,8,73,107],
        [0,62,34,42,58,2,126], [85,21,117,5,125,1,127], [52,102,71,85,71,102,52],
        [8,8,42,34,54,20,93], [119,99,107,8,107,99,119], [62,34,107,8,107,34,62],
        [73,62,34,107,34,62,73], [123,123,96,107,3,111,111], [91,27,96,107,3,108,109],
        [0,63,32,62,2,126,0], [64,95,81,93,69,125,1], [51,51,102,102,76,76,25]
    ];

    // === 3. DOM REFS ===
    const els = {
        app: document.getElementById('app'),
        screens: {
            landing: document.getElementById('screen-landing'),
            selection: document.getElementById('screen-selection'),
            generator: document.getElementById('screen-generator')
        },
        header: { left: document.getElementById('header-left'), title: document.getElementById('header-title') },
        inputs: {
            ornament: document.getElementById('input-ornament'),
            spectrum: document.getElementById('input-spectrum'),
            single: document.getElementById('text-single'),
            r: document.getElementById('text-r'), g: document.getElementById('text-g'), b: document.getElementById('text-b')
        },
        canvas: document.getElementById('canvas-output'),
        btnSave: document.getElementById('btn-save'),
        btnRegen: document.getElementById('btn-regen'),
        stats: document.getElementById('tech-stats'),
        cameraOverlay: document.getElementById('camera-overlay'),
        video: document.getElementById('video-feed'),
        scanCanvas: document.getElementById('canvas-scan')
    };

    // === 4. NAVIGATION ENGINE ===
    function navTo(screenId, mode = null) {
        // Hide all
        Object.values(els.screens).forEach(s => s.classList.remove('active'));
        
        // Set target
        els.screens[screenId].classList.add('active');
        state.currentScreen = screenId;

        // Header Logic
        if (screenId === 'landing') {
            els.header.left.innerHTML = '';
            els.header.title.textContent = 'Spectrum_qr';
        } else if (screenId === 'selection') {
            els.header.left.innerHTML = '<div class="header-btn" onclick="navTo(\'landing\')">←</div>';
            els.header.title.textContent = 'Select Mode';
        } else if (screenId === 'generator') {
            els.header.left.innerHTML = '<div class="header-btn" onclick="navTo(\'selection\')">←</div>';
            
            // Mode Logic
            state.mode = mode;
            setupGeneratorMode(mode);
        }
    }

    function setupGeneratorMode(mode) {
        // Reset UI
        els.inputs.ornament.classList.add('hidden');
        els.inputs.spectrum.classList.add('hidden');
        els.btnRegen.classList.add('hidden');
        els.btnSave.disabled = true;
        els.btnSave.style.opacity = '0.3';
        
        clearCanvas();

        if (mode === 'ornament') {
            els.header.title.textContent = 'QRnament';
            els.inputs.ornament.classList.remove('hidden');
            els.inputs.ornament.classList.add('flex'); // Flex container
            els.btnRegen.classList.remove('hidden');
        } else {
            els.header.title.textContent = 'Spectrum_qr';
            els.inputs.spectrum.classList.remove('hidden');
            els.inputs.spectrum.classList.add('flex');
            syncInputHeight(); // Initial sync
        }
    }

    function toggleMenu() {
        document.getElementById('menu-overlay').classList.toggle('hidden');
        document.getElementById('menu-overlay').classList.toggle('flex');
    }

    // === 5. INPUT HANDLING & SYNCHRONIZATION ===
    function handleInput() {
        if (state.mode === 'ornament') {
            const val = els.inputs.single.value;
            if (val.length > 0) {
                els.btnSave.disabled = false;
                els.btnSave.style.opacity = '1';
                generateOrnament();
            } else {
                els.btnSave.disabled = true;
                els.btnSave.style.opacity = '0.3';
                clearCanvas();
            }
            els.stats.innerText = `TEXT: ${val.length} CHARS`;
        } else {
            syncInputHeight(); // Keep heights aligned
            checkSpectrumValidity();
            generateSpectrum();
        }
    }

    // Synchronizes height of R, G, B textareas
    function syncInputHeight() {
        // Reset heights to auto to measure true scrollHeight
        const inputs = [els.inputs.r, els.inputs.g, els.inputs.b];
        inputs.forEach(i => i.style.height = 'auto');
        
        // Find max height
        const maxH = Math.max(...inputs.map(i => i.scrollHeight));
        
        // Apply max height to all
        inputs.forEach(i => i.style.height = maxH + 'px');
    }

    function checkSpectrumValidity() {
        const r = els.inputs.r.value.trim();
        const g = els.inputs.g.value.trim();
        const b = els.inputs.b.value.trim();
        
        const isValid = r.length > 0 && g.length > 0 && b.length > 0;

        if (isValid) {
            if (els.btnSave.disabled) {
                // Trigger flash animation
                els.btnSave.classList.add('flash-animation');
                setTimeout(() => els.btnSave.classList.remove('flash-animation'), 300);
            }
            els.btnSave.disabled = false;
            els.btnSave.style.opacity = '1';
        } else {
            els.btnSave.disabled = true;
            els.btnSave.style.opacity = '0.3';
        }
    }

    function hideKeyboard() {
        document.activeElement.blur();
    }

    // === 6. QR GENERATION ENGINES ===

    function clearCanvas() {
        const ctx = els.canvas.getContext('2d');
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, 512, 512);
    }

    // --- ORNAMENT ENGINE (Seeded Random) ---
    function generateOrnament() {
        const text = els.inputs.single.value;
        if (!text) return;

        try {
            const qr = qrcode(0, 'M');
            qr.addData(unescape(encodeURIComponent(text)));
            qr.make();
            
            const modCount = qr.getModuleCount();
            const quietZone = 4;
            const totalSize = modCount + quietZone * 2;
            const cellSize = 512 / totalSize;

            const ctx = els.canvas.getContext('2d');
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, 512, 512);

            // Generate Grids
            const gridR = buildGrid(totalSize);
            const gridG = buildGrid(totalSize);

            // Draw Layers (Screen blend)
            ctx.globalCompositeOperation = "screen";
            
            ctx.fillStyle = "#FF0000";
            drawGrid(ctx, gridR, totalSize, cellSize);
            
            ctx.fillStyle = "#00FF00";
            drawGrid(ctx, gridG, totalSize, cellSize);
            
            // Draw Blue Channel (Data)
            ctx.fillStyle = "#0000FF";
            for(let r=0; r<modCount; r++) {
                for(let c=0; c<modCount; c++) {
                    if(qr.isDark(r, c)) {
                        ctx.fillRect((c+quietZone)*cellSize, (r+quietZone)*cellSize, cellSize, cellSize);
                    }
                }
            }

            ctx.globalCompositeOperation = "source-over";

        } catch(e) { console.error(e); }
    }

    function regenerateOrnament() {
        state.seed = Math.random(); // Change seed
        generateOrnament();
    }

    // Seeded Random helper
    function seededRandom() {
        let x = Math.sin(state.seed++) * 10000;
        return x - Math.floor(x);
    }

    function buildGrid(size) {
        const grid = Array(size).fill(0).map(() => Array(size).fill(0));
        const center = Math.floor(size/2);
        const maxBlocks = Math.ceil((size/2 + 7)/7);
        const octantMap = new Map();

        for(let by=0; by<maxBlocks; by++) {
            for(let bx=by; bx<maxBlocks; bx++) {
                const patternIdx = Math.floor(seededRandom() * SPRITE_LIB.length);
                const pattern = SPRITE_LIB[patternIdx];
                const flipX = seededRandom() > 0.5;
                const flipY = seededRandom() > 0.5;

                for(let py=0; py<7; py++) {
                    for(let px=0; px<7; px++) {
                        let sX = flipX ? (6-px) : px;
                        let sY = flipY ? (6-py) : py;
                        
                        if((pattern[sY] >> (6-sX)) & 1) {
                            let xRel = (bx*7) + px - 3;
                            let yRel = (by*7) + py - 3;
                            
                            if(xRel >= yRel && yRel >= 0) {
                                octantMap.set(`${xRel},${yRel}`, true);
                            }
                        }
                    }
                }
            }
        }

        // Apply Symmetry
        octantMap.forEach((v, k) => {
            const [x, y] = k.split(',').map(Number);
            const points = [
                [x, y], [y, x], [-x, y], [-y, x],
                [x, -y], [y, -x], [-x, -y], [-y, -x]
            ];
            points.forEach(([px, py]) => {
                const aX = center + px;
                const aY = center + py;
                if(aX >= 0 && aX < size && aY >= 0 && aY < size) grid[aY][aX] = 1;
            });
        });

        return grid;
    }

    function drawGrid(ctx, grid, size, cell) {
        for(let r=0; r<size; r++) {
            for(let c=0; c<size; c++) {
                if(grid[r][c]) ctx.fillRect(c*cell, r*cell, cell+0.5, cell+0.5);
            }
        }
    }

    // --- SPECTRUM ENGINE ---
    function generateSpectrum() {
        const rText = els.inputs.r.value.trim();
        const gText = els.inputs.g.value.trim();
        const bText = els.inputs.b.value.trim();

        const ctx = els.canvas.getContext('2d');
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, 512, 512);

        if(!rText && !gText && !bText) return;

        // Determine Max Version
        let maxVer = 1;
        [rText, gText, bText].forEach(t => {
            if(!t) return;
            try {
                const tmp = qrcode(0, 'M');
                tmp.addData(unescape(encodeURIComponent(t)));
                tmp.make();
                const v = Math.floor((tmp.getModuleCount() - 17) / 4);
                if(v > maxVer) maxVer = v;
            } catch(e) {}
        });

        const matrixSize = (maxVer*4)+17;
        els.stats.innerText = `RGB_MODE: ACTIVE | MATRIX: ${matrixSize}x${matrixSize}`;

        ctx.globalCompositeOperation = "lighten";
        
        const colors = ["#FF0000", "#00FF00", "#0000FF"];
        const texts = [rText, gText, bText];

        texts.forEach((text, i) => {
            if(!text) return;
            try {
                const qr = qrcode(maxVer, 'M');
                qr.addData(unescape(encodeURIComponent(text)));
                qr.make();
                
                const mod = 512 / qr.getModuleCount();
                ctx.fillStyle = colors[i];
                
                for (let r = 0; r < qr.getModuleCount(); r++) {
                    for (let c = 0; c < qr.getModuleCount(); c++) {
                        if (qr.isDark(r, c)) ctx.fillRect(c * mod, r * mod, mod, mod);
                    }
                }
            } catch(e) {}
        });
        
        ctx.globalCompositeOperation = "source-over";
    }

    // === 7. CAMERA & SCANNING ===
    let stream = null;

    async function openCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            els.video.srcObject = stream;
            els.cameraOverlay.style.display = 'flex';
            requestAnimationFrame(scanFrame);
        } catch(e) {
            alert("Camera permission denied.");
        }
    }

    function closeCamera() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        els.cameraOverlay.style.display = 'none';
    }

    function scanFrame() {
        if(els.cameraOverlay.style.display === 'none') return;
        
        if(els.video.readyState === els.video.HAVE_ENOUGH_DATA) {
            const w = els.video.videoWidth, h = els.video.videoHeight;
            els.scanCanvas.width = w; els.scanCanvas.height = h;
            const ctx = els.scanCanvas.getContext('2d');
            ctx.drawImage(els.video, 0, 0, w, h);
            
            const data = ctx.getImageData(0, 0, w, h);
            const code = jsQR(data.data, w, h);
            
            if(code) {
                // Success! Feed data to inputs
                closeCamera();
                navTo('generator', 'ornament');
                els.inputs.single.value = code.data;
                handleInput();
            } else {
                requestAnimationFrame(scanFrame);
            }
        } else {
            requestAnimationFrame(scanFrame);
        }
    }

    // === 8. UTILS ===
    function saveImage() {
        const link = document.createElement('a');
        link.download = `spectrum_${Date.now()}.png`;
        link.href = els.canvas.toDataURL();
        link.click();
    }

</script>
